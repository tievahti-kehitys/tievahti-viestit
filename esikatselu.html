<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://uzaaynqxbfpjxgvetgam.supabase.co; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; base-uri 'none'; form-action 'none'" />
<title>Tievahdin kirje – esikatselu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />

</head>
<body>
<main>

    <iframe id="preview" class="tall" title="Kirjeen esikatselu" sandbox="" referrerpolicy="no-referrer"></iframe>
    <p class="small">Näin kirje näyttää vastaanottajan saapuneissa. Linkit eivät toimi esikatselussa.</p>
  </div>
</main>
<script src="esikatselu.js?v=20260909131028"></script>
